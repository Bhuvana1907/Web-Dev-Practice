<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <ul>
        <li>bhuvana</li>
        <li>kruthi</li>
        <li>indu</li>
        <li>santu</li>
        
    </ul>
    <ol reversed="true">
        <li>bhuvana</li>
        <li>kruthi</li>
        <li>indu</li>
        <li>santu</li>
    </ol>
    <ol start="1" type="a">
        <li>bhuvana</li>
        <li>kruthi</li>
        <li>indu</li>
        <li>santu</li>
    </ol>
    <h3>nested lists</h3>
    <ol>
        <li>eng</li>
        <ol>
            <li>maths</li>
        
        <li>telugu</li>
        </ol>

    </ol>
    <dl>
        <dt>bhuvana: </dt>
        <dd>she is a good girl</dd>
        <dt>INdu</dt>
        <dd>she is amzing</dd>
    </dl>
    
</body>
</html>
